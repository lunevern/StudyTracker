name: Build NianNian v1.1 APK
on:
  push:
    branches: [niannian-android-app-2026]
    paths:
      - 'niannian_v1_1_project.b64'
      - '.github/workflows/niannian-modern.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore NianNian sources
        run: |
          mkdir -p project
          base64 -d niannian_v1_1_project.b64 | tar -xz -C project
          test -f project/app/src/main/java/com/niannian/daybook/WidgetPainter.java
      - name: Build signed installable debug APK
        run: gradle --no-daemon -p project :app:assembleDebug
      - name: Rename output
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk NianNian-v1.1.0.apk
          ls -lh NianNian-v1.1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NianNian-v1.1.0-APK
          path: NianNian-v1.1.0.apk
          retention-days: 30
          if-no-files-found: error
