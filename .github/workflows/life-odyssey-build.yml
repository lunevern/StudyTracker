name: Build Life Odyssey Android APK
on:
  push:
    branches: [life-odyssey-android-2026]
    paths:
      - 'life_odyssey_source.b64'
      - '.github/workflows/life-odyssey-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Confirm Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore offline game source
        run: |
          mkdir -p game
          base64 -d life_odyssey_source.b64 | tar -xz -C game
          test -s game/app/src/main/assets/game.js
          test -s game/app/src/main/assets/ui.js
      - name: Build Android APK
        run: gradle --no-daemon -p game :app:assembleDebug --stacktrace
      - name: Stage and verify artifact
        run: |
          cp game/app/build/outputs/apk/debug/app-debug.apk LifeOdyssey-v1.0.0.apk
          test -s LifeOdyssey-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify LifeOdyssey-v1.0.0.apk
          sha256sum LifeOdyssey-v1.0.0.apk | tee LifeOdyssey-v1.0.0.sha256
          ls -lh LifeOdyssey-v1.0.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOdyssey-v1.0.0-Android-APK
          path: |
            LifeOdyssey-v1.0.0.apk
            LifeOdyssey-v1.0.0.sha256
          retention-days: 30
      - name: Publish retrievable base64 parts
        run: |
          mkdir -p life-odyssey-release
          base64 -w 0 LifeOdyssey-v1.0.0.apk | split -b 60000 -d -a 3 - life-odyssey-release/apk.part.
          cp LifeOdyssey-v1.0.0.sha256 life-odyssey-release/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add life-odyssey-release
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Life Odyssey v1.0.0 APK parts'
            git push origin HEAD:life-odyssey-android-2026
          fi
