name: Build Interaction Cleaner APK
on:
  push:
    branches: [douyin-interaction-cleaner-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source files
        run: |
          mkdir -p douyin-cleaner
          base64 -d interaction_cleaner_source.b64 | tar -xz -C douyin-cleaner
      - name: Build installable APK
        run: gradle --no-daemon -p douyin-cleaner :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractionCleaner-APK
          path: douyin-cleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
