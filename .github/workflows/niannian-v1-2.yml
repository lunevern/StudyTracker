name: Build NianNian v1.2 widget fix APK

on:
  push:
    branches: [niannian-android-app-2026]
    paths:
      - 'niannian_v1_2_overlay.b64'
      - '.github/workflows/niannian-v1-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore v1.1 project and apply v1.2 fixes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project
          base64 -d niannian_v1_1_project.b64 | tar -xz -C project
          base64 -d niannian_v1_2_overlay.b64 | tar -xz -C project
          grep -q 'android:configure="com.niannian.daybook.WidgetConfigActivity"' project/app/src/main/res/xml/widget_compact_info.xml
          grep -q 'android:configure="com.niannian.daybook.WidgetConfigActivity"' project/app/src/main/res/xml/widget_wide_info.xml
          grep -q 'versionName .1.2.0.' project/app/build.gradle
          test -f project/app/src/main/res/drawable/widget_theme_rose.xml
      - name: Build installable debug APK
        run: gradle --no-daemon -p project :app:assembleDebug --stacktrace
      - name: Validate build output
        shell: bash
        run: |
          set -euxo pipefail
          cp project/app/build/outputs/apk/debug/app-debug.apk NianNian-v1.2.0-widget-fix.apk
          test -s NianNian-v1.2.0-widget-fix.apk
          unzip -t NianNian-v1.2.0-widget-fix.apk | tail -n 2
          echo "APK size: $(stat -c%s NianNian-v1.2.0-widget-fix.apk) bytes"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NianNian-v1.2.0-widget-fix-APK
          path: NianNian-v1.2.0-widget-fix.apk
          if-no-files-found: error
          retention-days: 30
