name: Build 江湖万刃录 v0.2.0
on:
  push:
    branches: [jianghu-wanrenlu-2026]
    paths:
      - 'jianghu_v02_source.b64'
      - '.github/workflows/jianghu-build-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: jianghu-wanrenlu-2026
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: |
          test -d "$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Restore v0.2.0 source
        run: |
          mkdir -p jianghu-v02
          base64 -d jianghu_v02_source.b64 | tar -xz -C jianghu-v02
          test -f jianghu-v02/app/src/main/assets/game.js
          grep -q 'versionName .0.2.0.' jianghu-v02/app/build.gradle
      - name: Build APK
        run: gradle --no-daemon -p jianghu-v02 :app:assembleDebug
      - name: Verify APK signature and checksum
        run: |
          mkdir -p builds
          cp jianghu-v02/app/build/outputs/apk/debug/app-debug.apk builds/JiangHuWanRenLu-v0.2.0.apk
          test -s builds/JiangHuWanRenLu-v0.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify builds/JiangHuWanRenLu-v0.2.0.apk
          (cd builds && sha256sum JiangHuWanRenLu-v0.2.0.apk > JiangHuWanRenLu-v0.2.0.sha256)
          ls -lh builds/JiangHuWanRenLu-v0.2.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JiangHuWanRenLu-v0.2.0-APK
          path: |
            builds/JiangHuWanRenLu-v0.2.0.apk
            builds/JiangHuWanRenLu-v0.2.0.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish build to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/JiangHuWanRenLu-v0.2.0.apk builds/JiangHuWanRenLu-v0.2.0.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish JiangHuWanRenLu v0.2.0 APK [skip ci]'
            git push origin HEAD:jianghu-wanrenlu-2026
          fi
